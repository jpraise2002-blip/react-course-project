<!DOCTYPE html>
<html>

<head>
  <title>Exercise 3A</title>
  <style>
    .on-button {
      background-color: rgb(25, 135, 84);
      color: white;
      border-radius: 5px;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
    }
    .off-button {
      background-color: rgb(220, 53, 69);
      color: white;
      border-radius: 5px;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/dayjs.js">
  </script>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">
    
    function App () {

      const [isButtonOn, setIsButtonOn] = React.useState(true)

      function switchButtonText () {

        setIsButtonOn(!isButtonOn);

        // if(isButtonOn) {
        //   setIsButtonOn(false)
        // } else {
        //   setIsButtonOn(true)
        // }
      }

      return (
        <div>
          <button className={isButtonOn ? 'on-button' : 'off-button'}
          onClick={switchButtonText}>
          {isButtonOn ? 'ON' : 'OFF'}
          </button>
        </div>
      )
    }
    

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);




  </script>
</body>

</html>
