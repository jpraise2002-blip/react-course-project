<!DOCTYPE html>
<html>

<head>
  <title>Exercise 3A</title>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/dayjs.js">
  </script>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">

    function CounterApp({ count, setCount }) {
      

      function increaseCount() {
        setCount(count + 1)
        console.log(`clicked ${count + 1} times`)
      }

      return (
        <>
         <button onClick={increaseCount}>Clicked {count} {count === 1 ? 'time' : 'times'}</button>
        </>
      )
    }

    
    
    function App() {

      const [count, setCount] = React.useState(0);

      function resetCount() {
        setCount(0)
      }

      return (
        <>
          <CounterApp
            count={count}
            setCount={setCount}
           />
          <CounterApp
            count={count}
            setCount={setCount}
          />
          <button onClick={resetCount}>Reset</button>
        </>


      )
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);




  </script>
</body>

</html>
